# Production stack on the VPS: PostgreSQL + API behind Caddy (automatic HTTPS).
# Usage (from the repository root):
#   cp apps/api/.env.example deploy/api.env   # then fill it in
#   API_DOMAIN=api.example.com docker compose -f deploy/docker-compose.yml up -d --build
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: agg
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agg"]
      interval: 10s

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file: api.env
    environment:
      DATABASE_URL: postgres://agg:${POSTGRES_PASSWORD}@postgres:5432/agg
      PORT: 4000
      TRUST_PROXY: 1
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
